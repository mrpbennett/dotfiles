onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
auto_switch = true
name = "catppuccin-latte"
light_name = "catppuccin-latte"
dark_name = "catppuccin-macchiato"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
confirm_close = false
pane_gaps = false
prompt_new_tab_name = false
mouse_capture = true

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[keys]
prefix = "ctrl+space"

reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_vertical = ["prefix+|", "prefix+h", "alt+enter"]
split_horizontal = ["prefix+minus", "prefix+v", "alt+shift+enter"]
close_pane = ["alt+esc"]
toggle_sidebar = "prefix+b"

focus_pane_left = ["ctrl+alt+h", "ctrl+alt+left"]
focus_pane_down = ["ctrl+alt+j", "ctrl+alt+down"]
focus_pane_up = ["ctrl+alt+k", "ctrl+alt+up"]
focus_pane_right = ["ctrl+alt+l", "ctrl+alt+right"]

rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "ctrl+alt+["]
next_tab = ["prefix+n", "alt+right", "ctrl+alt+]"]
#resize_mode = "prefix+alt+r"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up", "alt+k"]
next_workspace = ["prefix+shift+n", "alt+down","alt+j"]


###########################################
# Open useful TUI apps right within Herdr
###########################################

# opens a floating pane
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "70%"

# open lazygit
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

# open hunk diff
[[keys.command]]
key = "prefix+alt+h"
type = "popup"
command = "hunk diff"
description = "show hunk diff"
width = "90%"
height = "90%"

# open k9s
[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "k9s"
description = "Open k9s"
width = "90%"
height = "90%"

# open gh dash for pr reviews
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "gh dash"
description = "show gh dash to review PRs"
width = "90%"
height = "90%"

# open btop
[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
description = "run btop"
width = "90%"
height = "90%"

###########################################
# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
###########################################
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
