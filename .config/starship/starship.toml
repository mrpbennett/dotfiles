"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_commit\
$sudo\
$container\
$docker_context\
$python\
$golang\
$terraform\
$helm\
$fill\
$kubernetes\
$gcloud\
$status\
$line_break\
$character"""

right_format = """
$cmd_duration\
"""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[fill]
symbol = " "

# -- NERDFONT --
[container]
symbol = " "

[directory]
style = "blue"
read_only = " 󰌾"
truncation_length = 2
truncation_symbol = "../"

[docker_context]
symbol = " "

[gcloud]
disabled = true
format = '[$symbol$account $active]($style) '
style = 'bold yellow'

[git_branch]
symbol = " "

[git_commit]
tag_symbol = '  '

[golang]
symbol = " "

[helm]
symbol = " "

[hostname]
ssh_symbol = " "

[kubernetes]
symbol = "󱃾 "
disabled = false
format = "[$symbol$context( in $namespace ns)]($style) "

[[kubernetes.contexts]]
context_pattern = "portland"
symbol = "🏠 "
style = "blue"

[[kubernetes.contexts]]
context_pattern = "tailscale-.*"
symbol = "✈️ "
style = "blue"
context_alias = "tailscale"

[python]
symbol = " "

[terraform]
symbol = " "
