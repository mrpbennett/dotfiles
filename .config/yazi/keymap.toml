[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"


[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "Go to config directory"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Developer/"
desc = "Go to projects"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd ~/Developer/pulsepoint/app-kubernetes/clusters/et-ma2-prod/tam/"
desc = "Go to tam namespace"


[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"
